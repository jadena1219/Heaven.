<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heaven — Isles of Gold</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='%23ffce7a'/><circle cx='50' cy='50' r='44' fill='none' stroke='%23ffce7a' stroke-opacity='.45' stroke-width='6'/></svg>">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#f2bd79; height:100%; }
  canvas { display:block; touch-action:none; }
  #title {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; z-index:10; opacity:0; transition:opacity 2.8s ease;
    font-family: Georgia, 'Times New Roman', serif; color:#6b4310;
    text-shadow: 0 0 26px rgba(255,236,190,.95), 0 1px 2px rgba(90,50,10,.25);
  }
  #title.show { opacity:1; }
  #title h1 { font-size:clamp(38px, 7vw, 92px); font-weight:400; letter-spacing:.55em; margin:0 0 .2em .55em; }
  #title p  { font-size:clamp(13px, 1.6vw, 19px); letter-spacing:.5em; margin:0 0 0 .5em; opacity:.85; font-style:italic; }
  #hint {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    padding:9px 20px; border-radius:22px; z-index:10; pointer-events:none;
    font:13px/1.5 Georgia, serif; letter-spacing:.14em; color:#fff3da;
    max-width:min(92vw, 640px); text-align:center;
    background:rgba(84,52,18,.28); backdrop-filter:blur(6px);
    text-shadow:0 0 12px rgba(255,205,130,.8);
    border:1px solid rgba(255,226,170,.25);
    opacity:0; transition:opacity 1.6s ease;
  }
  #hint.show { opacity:1; }
  #err {
    position:fixed; left:12px; top:12px; z-index:20; max-width:70vw;
    font:12px/1.4 monospace; color:#5a1a00; background:rgba(255,240,220,.9);
    padding:8px 10px; border-radius:6px; display:none; white-space:pre-wrap;
  }
  #loader {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:15; pointer-events:none; text-align:center;
    font:italic 15px/1.8 Georgia, serif; letter-spacing:.4em; color:#7a4d15;
    text-shadow:0 0 22px rgba(255,236,190,.9);
    animation:loaderPulse 2.6s ease-in-out infinite;
    transition:opacity 1.8s ease;
  }
  #loader.hide { opacity:0; animation:none; }
  @keyframes loaderPulse { 0%,100% { opacity:.35; } 50% { opacity:.9; } }
</style>
</head>
<body>
<div id="title"><h1>H E A V E N</h1><p>the isles of gold</p></div>
<div id="hint"></div>
<div id="err"></div>
<div id="loader">gathering light…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script>
  window.__errors = [];
  window.addEventListener('error', (e) => {
    window.__errors.push(String(e.message || e.error));
    const d = document.getElementById('err');
    d.style.display = 'block';
    d.textContent = window.__errors.join('\n');
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__errors.push('unhandled rejection: ' + String(e.reason && e.reason.message || e.reason));
    const d = document.getElementById('err');
    d.style.display = 'block';
    d.textContent = window.__errors.join('\n');
  });
  /* a failed CDN import dies before the module can say anything — watchdog it */
  window.__loadWatchdog = setTimeout(() => {
    if (!(window.__heaven && window.__heaven.ready)){
      const l = document.getElementById('loader');
      l.style.animation = 'none';
      l.style.opacity = 1;
      l.innerHTML = 'the light is not reaching us —<br>check your connection and reload';
    }
  }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   0. Seeded randomness + JS value noise (deterministic scene)
   ============================================================ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng = mulberry32(1219);
const R  = () => rng();
const RR = (a,b) => a + rng()*(b-a);

function hash2(x, y, s){ const h = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise2(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx*fx*(3-2*fx); fy = fy*fy*(3-2*fy);
  const a = hash2(ix,iy,s), b = hash2(ix+1,iy,s), c = hash2(ix,iy+1,s), d = hash2(ix+1,iy+1,s);
  return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
}
function fbm2(x, y, s, oct){
  let v = 0, amp = 0.5, tot = 0;
  for (let i = 0; i < oct; i++){ v += amp * vnoise2(x, y, s + i*17.31); tot += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
  return v / tot;
}
function fbm3(x, y, z, s, oct){ return (fbm2(x + z*0.7, y - z*0.4, s, oct) + fbm2(y + x*0.6, z + x*0.3, s + 5.1, oct)) * 0.5; }

/* ============================================================
   1. Renderer / scene / camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
let pixelLevel = 2;   // start mid-ladder; the controller walks both ways from here
/* quality ladder: px is an ABSOLUTE render scale — above the display's own
   dpr it acts as supersampling, the only antialiasing that also calms
   shader shimmer (grass speculars, crystal fresnel), which MSAA cannot
   touch. The controller steps down when frames sag and back up when there
   is headroom to spend; msaa changes ride along at the rungs that need them. */
const QUALITY = [
  { px: 2.0,  msaa: 4 },   // supersample + heavy MSAA — strong GPUs earn this
  { px: 1.5,  msaa: 2 },
  { px: 1.25, msaa: 2 },   // default
  { px: 1.0,  msaa: 2 },
  { px: 0.8,  msaa: 0 },   // survival mode
];
renderer.setPixelRatio(QUALITY[pixelLevel].px);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;   // dawn ramp: the auto-iris eases this up to ~1.0 over the first seconds
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xe9a75f);
const FOG_DENSITY = 0.00062;
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.5, 9000);
camera.rotation.order = 'YXZ';
camera.position.set(40, 150, 560);

/* Shared time uniform, ticked once per frame */
const uTime = { value: 0 };
const SUN_DIR = new THREE.Vector3(0.05, 0.185, -0.982).normalize();
const SUN_POS = SUN_DIR.clone().multiplyScalar(4200);

/* Directional aerial perspective for every built-in-fog material (islands,
   meadows, trees, rocks, drifting petals): same math as fogTint/fogFactor2
   in GLSL_FOGF, patched into three's fog chunks before the first compile. */
THREE.ShaderChunk.fog_pars_vertex = /* glsl */`
#ifdef USE_FOG
  varying float vFogDepth;
  varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = /* glsl */`
#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vec4 fogW = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    fogW = instanceMatrix * fogW;
  #endif
  vFogWorld = (modelMatrix * fogW).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = /* glsl */`
#ifdef USE_FOG
  uniform vec3 fogColor;
  varying float vFogDepth;
  varying vec3 vFogWorld;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear;
    uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = /* glsl */`
#ifdef USE_FOG
  vec3 fogRd = normalize(vFogWorld - cameraPosition);
  float fogHgt = mix(1.3, 0.7, smoothstep(-235.0, 160.0, vFogWorld.y));
  #ifdef FOG_EXP2
    float fogFac = 1.0 - exp(- fogDensity * fogDensity * fogHgt * fogHgt * vFogDepth * vFogDepth);
  #else
    float fogFac = smoothstep(fogNear, fogFar, vFogDepth);
  #endif
  float fogSun = max(dot(fogRd, vec3(0.04997, 0.18490, -0.98149)), 0.0);
  vec3 fogTinted = mix(vec3(0.68, 0.44, 0.28), fogColor, 0.55 + 0.45*fogSun)
                 + vec3(1.05, 0.76, 0.46) * pow(fogSun, 6.0) * 0.35;
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fogTinted, fogFac);
#endif`;
const MIST_Y  = -235;
const GATE_POS = new THREE.Vector3(60, 40, -1500);

/* Lights — no shadow maps at all; light is faked + rim glow */
const hemi = new THREE.HemisphereLight(0xffd9a3, 0x9c6630, 0.72);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc98a, 1.75);
sun.position.copy(SUN_DIR.clone().multiplyScalar(100));
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffd9a8, 0.12));

/* ============================================================
   2. Procedural canvas textures
   ============================================================ */
function canvasTex(size, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 2;
  return t;
}
/* soft cloud puff: layered blurry blobs */
const texPuff = canvasTex(256, (g, s) => {
  g.clearRect(0,0,s,s);
  const blobs = 26;
  for (let i = 0; i < blobs; i++){
    const a = R()*Math.PI*2, rr = R()*s*0.26;
    const x = s/2 + Math.cos(a)*rr, y = s/2 + Math.sin(a)*rr*0.72;
    const r = s*(0.10 + R()*0.16);
    const gr = g.createRadialGradient(x,y,0, x,y,r);
    gr.addColorStop(0, 'rgba(255,255,255,0.10)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
});
/* radial glow */
const texGlow = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  gr.addColorStop(0.0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.25,'rgba(255,244,220,0.55)');
  gr.addColorStop(0.6, 'rgba(255,230,180,0.16)');
  gr.addColorStop(1.0, 'rgba(255,220,160,0)');
  g.fillStyle = gr; g.fillRect(0,0,s,s);
});
/* flare ring */
const texRing = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s/2,s/2,s*0.30, s/2,s/2,s*0.48);
  gr.addColorStop(0.0, 'rgba(255,220,170,0)');
  gr.addColorStop(0.5, 'rgba(255,214,160,0.55)');
  gr.addColorStop(1.0, 'rgba(255,190,140,0)');
  g.fillStyle = gr; g.fillRect(0,0,s,s);
});
/* sparkle star */
const texStar = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  const c = s/2;
  const beam = (w, l) => {
    const gr = g.createLinearGradient(c-l, c, c+l, c);
    gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(0.5,'rgba(255,255,255,0.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(c-l, c-w/2, l*2, w);
  };
  beam(4, s*0.48);
  g.save(); g.translate(c,c); g.rotate(Math.PI/2); g.translate(-c,-c); beam(4, s*0.48); g.restore();
  const gr = g.createRadialGradient(c,c,0,c,c,s*0.2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(c,c,s*0.2,0,7); g.fill();
});
/* flower sprite */
const texFlower = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  const c = s/2;
  for (let i = 0; i < 6; i++){
    const a = i/6*Math.PI*2;
    const x = c + Math.cos(a)*s*0.18, y = c + Math.sin(a)*s*0.18;
    const gr = g.createRadialGradient(x,y,0, x,y,s*0.17);
    gr.addColorStop(0,'rgba(255,252,245,0.95)'); gr.addColorStop(1,'rgba(255,252,245,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,s*0.17,0,7); g.fill();
  }
  const gr = g.createRadialGradient(c,c,0, c,c,s*0.14);
  gr.addColorStop(0,'rgba(255,214,120,1)'); gr.addColorStop(1,'rgba(255,214,120,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(c,c,s*0.14,0,7); g.fill();
});
/* hanging vine strand with blossoms */
const texVine = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  g.strokeStyle = 'rgba(158,148,84,0.9)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(s/2, 0);
  for (let y = 0; y <= s; y += 8) g.lineTo(s/2 + Math.sin(y*0.35)*4, y);
  g.stroke();
  for (let i = 0; i < 9; i++){
    const y = 6 + i*(s-10)/9, x = s/2 + Math.sin(y*0.35)*4 + (R()-0.5)*10;
    const r = 3.4 + R()*2.6;
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    const warm = R() > 0.5;
    gr.addColorStop(0, warm ? 'rgba(255,236,200,0.95)' : 'rgba(255,214,220,0.95)');
    gr.addColorStop(1, 'rgba(255,230,200,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
});
/* feather */
const texFeather = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  const cx = s/2;
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx, s*0.04); g.quadraticCurveTo(cx+3, s*0.5, cx, s*0.96); g.stroke();
  for (let i = 0; i < 15; i++){
    const t = 0.08 + i/15*0.82, y = t*s;
    const w = Math.sin(t*Math.PI)*s*0.30;
    const gr = g.createLinearGradient(cx-w, y, cx+w, y);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(0.5,'rgba(255,252,246,0.35)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.fillRect(cx-w, y-2.2, w*2, 4.4);
  }
});
/* petal */
const texPetal = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  const gr = g.createRadialGradient(s/2, s*0.42, 0, s/2, s*0.5, s*0.42);
  gr.addColorStop(0, 'rgba(255,240,235,0.95)');
  gr.addColorStop(0.7,'rgba(255,225,215,0.55)');
  gr.addColorStop(1, 'rgba(255,220,210,0)');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(s/2, s/2, s*0.26, s*0.42, 0, 0, 7); g.fill();
});
/* leaf */
const texLeaf = canvasTex(64, (g, s) => {
  g.clearRect(0,0,s,s);
  const gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s*0.46);
  gr.addColorStop(0, 'rgba(226,196,110,0.98)');
  gr.addColorStop(0.75,'rgba(206,170,88,0.8)');
  gr.addColorStop(1, 'rgba(200,160,80,0)');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(s/2, s/2, s*0.2, s*0.44, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,236,170,0.85)'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(s/2, s*0.1); g.lineTo(s/2, s*0.9); g.stroke();
});

/* ============================================================
   3. GLSL shared chunks
   ============================================================ */
const GLSL_NOISE = /* glsl */`
  float hash12(vec2 p){ p = fract(p*vec2(123.34, 345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    float a = hash12(i), b = hash12(i+vec2(1.,0.)), c = hash12(i+vec2(0.,1.)), d = hash12(i+vec2(1.,1.));
    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
  }
  float fbm(vec2 p){
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; }
    return v;
  }
  float fbm3o(vec2 p){   /* 3 octaves — for low-amplitude detail where 4-5 sink below the dither floor */
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 3; i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; }
    return v;
  }
`;
const GLSL_FOGF = /* glsl */`
  float fogFactor(float dist, float density){
    float f = dist * density;
    return 1.0 - exp(-f*f);
  }
  /* directional aerial perspective — the haze knows where the sun is:
     warm gold looking sunward, dusty rose away (the Belt of Venus),
     and it pools thicker near the mist sea than at altitude */
  vec3 fogTint(vec3 rd, vec3 baseCol){
    float s = max(dot(rd, vec3(${SUN_DIR.x.toFixed(5)}, ${SUN_DIR.y.toFixed(5)}, ${SUN_DIR.z.toFixed(5)})), 0.0);
    return mix(vec3(0.68, 0.44, 0.28), baseCol, 0.55 + 0.45*s)
         + vec3(1.05, 0.76, 0.46) * pow(s, 6.0) * 0.35;
  }
  float fogHeight(float y){ return mix(1.3, 0.7, smoothstep(-235.0, 160.0, y)); }
  float fogFactor2(float dist, float density, float y){
    float f = dist * density * fogHeight(y);
    return 1.0 - exp(-f*f);
  }
`;

/* ============================================================
   4. Sky dome — golden hour, huge soft sun, aurora bands
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: true, fog: false,
  uniforms: { uTime, uSunDir: { value: SUN_DIR } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform float uTime;
    uniform vec3 uSunDir;
    ${GLSL_NOISE}
    void main(){
      vec3 dir = normalize(vDir);
      float h = dir.y;
      vec3 zen = vec3(0.44, 0.325, 0.26);
      vec3 mid = vec3(0.95, 0.55, 0.24);
      vec3 low = vec3(0.80, 0.40, 0.13);
      vec3 col = mix(mid, zen, smoothstep(0.05, 0.7, h));
      col = mix(low, col, smoothstep(-0.28, 0.12, h));
      col = mix(col, low*0.82, smoothstep(0.35, 0.95, -h));
      /* cool lilac high overhead — the gold sings against its complement */
      col = mix(col, vec3(0.37, 0.35, 0.44), smoothstep(0.45, 0.95, h)*0.45);
      /* horizon warmth follows the sun's bearing; the anti-sun side falls dusty */
      vec2 dxz = dir.xz / max(length(dir.xz), 1e-4);
      float azs = pow(max(dot(dxz, normalize(uSunDir.xz)), 0.0), 2.0);
      col += vec3(1.0, 0.62, 0.34) * pow(1.0 - abs(h), 3.0) * mix(-0.06, 0.20, azs);
      /* faint salmon band low in the sky */
      col += vec3(0.98, 0.55, 0.4) * smoothstep(0.10, 0.16, h) * (1.0 - smoothstep(0.19, 0.30, h)) * 0.10;
      /* huge soft low sun */
      float sd = max(dot(dir, uSunDir), 0.0);
      float disc = smoothstep(0.9962, 0.99905, sd);
      float glow = pow(sd, 20.0)*0.5 + pow(sd, 5.0)*0.16;
      col += vec3(1.0, 0.72, 0.42)*glow + vec3(1.0, 0.9, 0.72)*disc*2.2;
      /* faint rose & champagne aurora, upper sky — sampled in a seam-free
         projected domain (raw azimuth would leave a hard line at ±pi) */
      vec2 sp = dir.xz / (1.0 + max(dir.y, 0.0));
      float band = fbm(vec2((sp.x + sp.y*0.7)*6.0 + uTime*0.016, dir.y*5.5 - uTime*0.011));
      float aur = smoothstep(0.18, 0.6, h) * smoothstep(0.42, 0.78, band);
      vec3 aurCol = mix(vec3(0.9, 0.42, 0.42), vec3(0.95, 0.7, 0.4),
                        vnoise(sp*4.0 + uTime*0.02));
      col += aurCol * aur * 0.34;
      /* faint high cloud streaks — 3 octaves: at 0.07 amplitude the rest sinks below the dither */
      col += vec3(0.9, 0.62, 0.36) * fbm3o(vec2((sp.x - sp.y*0.6)*7.0 + uTime*0.004, dir.y*9.0)) * 0.07 * smoothstep(0.0, 0.35, h);
      /* dither to kill banding */

const _sunNdc = new THREE.Vector3(), _flarePos = new THREE.Vector3();
function updateFlare(dt){
  _sunNdc.copy(SUN_POS).project(camera);
  const onScreen = _sunNdc.z < 1 && Math.abs(_sunNdc.x) < 1.25 && Math.abs(_sunNdc.y) < 1.25;
  let target = 0;
  if (onScreen){
    const edge = Math.max(Math.abs(_sunNdc.x), Math.abs(_sunNdc.y));
    target = 1 - THREE.MathUtils.smoothstep(edge, 0.85, 1.25);
    if (target > 0.01){
      flareCheck -= dt;
      if (flareCheck <= 0){   // occlusion ray is throttled — it can touch many triangles
        flareCheck = 0.12;
        flareRay.set(camera.position, _flarePos.copy(SUN_POS).sub(camera.position).normalize());
        flareRay.far = 2600;   // covers the camera→gate distance from anywhere on the tour
        flareOccluded = flareRay.intersectObjects(occluders, false).length > 0;
      }
      if (flareOccluded) target = 0;
    }
  }
  flareVis += (target - flareVis) * Math.min(1, dt*7);
  const D = 30;   // place sprites 30 units in front of camera
  const tanF = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  for (let i = 0; i < FLARE_ELEMENTS.length; i++){
    const el = FLARE_ELEMENTS[i], sp = flareSprites[i];
    const nx = _sunNdc.x * (1 - el.f*1.6), ny = _sunNdc.y * (1 - el.f*1.6);
    _flarePos.set(nx * tanF * camera.aspect * D, ny * tanF * D, -D);
    sp.position.copy(_flarePos.applyMatrix4(camera.matrixWorld));
    const sc = (el.px / innerHeight) * 2 * tanF * D;
    sp.scale.set(sc * (el.w || 1), sc * (el.h || 1), 1);
    sp.material.opacity = el.op * flareVis;
  }
  /* auto-iris: the eye stops down against the sun, opens in the shade of the
     dive, and performs the dawn ramp from the low starting exposure */
  const expTarget = 1.0 - flareVis*0.22
                  + THREE.MathUtils.smoothstep(-camera.position.y, 40, 220)*0.14;
  renderer.toneMappingExposure += (expTarget - renderer.toneMappingExposure) * Math.min(1, dt*0.8);
  /* crepuscular rays ride flareVis; tap count set by the quality ladder */
  gradeUniforms.uSunScreen.value.set(_sunNdc.x*0.5 + 0.5, _sunNdc.y*0.5 + 0.5);
  gradeUniforms.uRayStrength.value = gradeUniforms.uTaps.value > 0 ? flareVis * 0.34 : 0;
}

function buildGodRays(){
  const rayDir = SUN_DIR.clone().negate().normalize(); // from sun into scene
  const geoms = [];
  const N = 9;
  for (let i = 0; i < N; i++){
    const w = RR(50, 170), L = RR(1500, 2500);
    const g = new THREE.PlaneGeometry(w, L, 1, 1);
    const seed = R()*100;
    const seeds = new Float32Array(g.attributes.position.count).fill(seed);
    g.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
    /* orient: local +y along rayDir, then random roll about the ray axis */
    const horiz = new THREE.Vector3().crossVectors(rayDir, new THREE.Vector3(0,1,0)).normalize();
    const roll = RR(-1.4, 1.4);
    const q1 = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), rayDir);
    const q2 = new THREE.Quaternion().setFromAxisAngle(rayDir, roll);
    const m = new THREE.Matrix4().makeRotationFromQuaternion(q2.multiply(q1));
    g.applyMatrix4(m);
    const cx = RR(-750, 750), cz = RR(-950, 50);
    const cy = 240 - rayDir.y * 0 + RR(-60, 260);
    g.translate(cx + horiz.x*RR(-40,40), cy, cz);
    geoms.push(g);
  }
  const merged = BufferGeometryUtils.mergeGeometries(geoms);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide, fog: false,
    uniforms: { uTime },
    vertexShader: /* glsl */`
      attribute float aSeed;
      varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vW;
      void main(){
        vUv = uv; vSeed = aSeed;
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vW;
      uniform float uTime;
      ${GLSL_NOISE}
      void main(){
        float ex = sin(vUv.x*3.14159);
        float ey = sin(vUv.y*3.14159);
        float flow = fbm(vec2(vUv.y*2.6 - uTime*0.035, vUv.x*2.0 + vSeed));
        float pulse = 0.55 + 0.45*sin(uTime*0.07 + vSeed*13.7);

        float toward = pow(max(dot(-vDir, vec3(${SUN_DIR.x.toFixed(5)}, ${SUN_DIR.y.toFixed(5)}, ${SUN_DIR.z.toFixed(5)})), 0.0), 3.0);

      }
    `

}

/* one displacement function shared by geometry, placement & anchors */
function islandSurface(r, seed, sx, sy, sz){
  const ny = sy / r;
  if (ny >= 0){
    const d = Math.min(1, Math.hypot(sx, sz) / r);
    const meadow = fbm2(sx*0.045, sz*0.045, seed, 4);
    const y = r * 0.30 * (1 - d*d) + meadow * 4.5 * Math.pow(1 - d, 1.2);
    return [sx, y, sz];
  }
  const n = fbm2(sx*0.06, sz*0.06, seed + 9, 4);
  const pin = Math.pow(1 + ny, 0.72);
  const cragAmt = Math.min(1, -ny*2);
  const rad = 1 + (n - 0.5) * 0.85 * cragAmt;
  return [ sx * pin * rad, r * ny * (1.14 + 0.3*(n - 0.5)), sz * pin * rad ];
}
function islandTopY(r, seed, x, z){
  const d = Math.min(1, Math.hypot(x, z) / r);
  const meadow = fbm2(x*0.045, z*0.045, seed, 4);
  return r * 0.30 * (1 - d*d) + meadow * 4.5 * Math.pow(1 - d, 1.2);
}
function undersidePoint(r, seed, angle, ny){
  const ring = r * Math.sqrt(Math.max(0, 1 - ny*ny));
  return islandSurface(r, seed, Math.cos(angle)*ring, r*ny, Math.sin(angle)*ring);
}

function buildIslandGeometry(r, seed){
  const g = new THREE.SphereGeometry(r, 46, 32);
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cGrass  = new THREE.Color(0xd6b666);
  const cGrass2 = new THREE.Color(0xac9148);
  const cStone  = new THREE.Color(0xfbf0d8);
  const cUnder  = new THREE.Color(0xe3c093);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const sx = pos.getX(i), sy = pos.getY(i), sz = pos.getZ(i);
    const ny = sy / r;
    const [x, y, z] = islandSurface(r, seed, sx, sy, sz);
    pos.setXYZ(i, x, y, z);
    if (ny >= 0){
      const d = Math.min(1, Math.hypot(sx, sz) / r);
      tmp.copy(cGrass).lerp(cGrass2, fbm2(sx*0.09, sz*0.09, seed + 3, 3));
      tmp.lerp(cStone, THREE.MathUtils.smoothstep(d, 0.82, 1.0));
    } else {
      const t = Math.min(1, -ny*1.35);
      tmp.copy(cStone).lerp(cUnder, t);
      tmp.multiplyScalar(1 - t*0.16); // faint baked AO toward the pinch
    }
    colors[i*3] = tmp.r; colors[i*3+1] = tmp.g; colors[i*3+2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  /* islands are untextured: drop uv+normal and weld the sphere's UV seam
     so computeVertexNormals gives a seamless shading gradient */
  g.deleteAttribute('uv');
  g.deleteAttribute('normal');
  const welded = BufferGeometryUtils.mergeVertices(g);
  welded.computeVertexNormals();
  return welded;
}

/* --- crystal shader ---------------------------------------- */
function crystalShader(yRange, glowMul, fogMix){
  /* used on both InstancedMesh (islands) and Mesh (gate): three defines
     USE_INSTANCING and declares instanceMatrix automatically when instanced */
  return new THREE.ShaderMaterial({
    fog: false,
    uniforms: {
      uTime,
      uYRange: { value: yRange },
      uGlow: { value: glowMul },
      uFogColor: { value: FOG_COLOR },
      uFogDensity: { value: FOG_DENSITY },
      uFogMix: { value: fogMix },
    },
    vertexShader: /* glsl */`
      varying vec3 vN; varying vec3 vW; varying float vY; varying float vPh;
      void main(){
        #ifdef USE_INSTANCING
          mat4 im = instanceMatrix;
        #else
          mat4 im = mat4(1.0);
        #endif
        vY = position.y;
        vec4 wp = modelMatrix * im * vec4(position, 1.0);
        vW = wp.xyz;
        vN = normalize(mat3(modelMatrix) * mat3(im) * normal);
        vPh = fract(sin(dot(im[3].xyz + vec3(1.0), vec3(12.98, 78.23, 37.71))) * 43758.55) * 6.283;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vN; varying vec3 vW; varying float vY; varying float vPh;
      uniform float uTime, uYRange, uGlow, uFogDensity, uFogMix;
      uniform vec3 uFogColor;
      ${GLSL_FOGF}
      void main(){
        float t = clamp(vY / uYRange * 0.5 + 0.5, 0.0, 1.0);
        vec3 base = mix(vec3(0.82, 0.42, 0.14), vec3(1.0, 0.9, 0.62), t);
        vec3 vDir = normalize(cameraPosition - vW);
        float fres = pow(1.0 - abs(dot(normalize(vN), vDir)), 2.0);
        float pulse = 0.72 + 0.28 * sin(uTime*1.4 + vPh);
        vec3 col = base * (0.55 + 0.45*pulse) + vec3(1.0, 0.86, 0.58) * fres * 1.7 * pulse * uGlow;
        float ff = fogFactor2(distance(cameraPosition, vW), uFogDensity, vW.y) * uFogMix;
        col = mix(col, fogTint(normalize(vW - cameraPosition), uFogColor), ff);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
}

    trunk.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const blobDefs = [
    [ 2.4, 16.5,  1.8, 5.6], [-3.2, 15.0, -1.6, 4.9],
    [ 0.4, 20.0, -2.4, 4.6], [-0.8, 22.5,  0.8, 3.9], [ 3.0, 19.0, -3.4, 3.4],
  ];
  const cLo = new THREE.Color(0x83702c), cHi = new THREE.Color(0xdfc06a);
  for (const [bx, by, bz, br] of blobDefs){
    const b = new THREE.IcosahedronGeometry(br, 2);
    const p = b.attributes.position;
    const col = new Float32Array(p.count*3);
    const tmp = new THREE.Color();
    for (let i = 0; i < p.count; i++){
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
      const len = Math.hypot(vx, vy, vz) || 1;
      const disp = 1 + (fbm3(vx*0.35, vy*0.35, vz*0.35, seed, 3) - 0.5) * 0.85;
      p.setXYZ(i, vx*disp, vy*disp*0.82, vz*disp);
      const up = (vy/len)*0.5 + 0.5;
      tmp.copy(cLo).lerp(cHi, Math.pow(up, 1.4) * (0.55 + 0.45*fbm3(vx, vy, vz, seed+2, 2)));
      col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;

  }

vineGeo.translate(0, -4.5, 0);
const rockGeo = new THREE.IcosahedronGeometry(1, 0);
const rockMat = new THREE.MeshLambertMaterial({ color: 0xf4e5c6 });

/* --- waterfall shader ---------------------------------------
   NOTE on additive alpha: this shader (and embers/motes/leaf-trails) emits
   rgb premultiplied by alpha, so under (SRC_ALPHA, ONE) the framebuffer sees
   color*a^2 — a squared fade curve. The god rays / light pillar use the
   emit-alpha-once convention instead. Both are deliberate: every constant
   here was tuned by eye against its own curve. If you retune, keep each
   shader's existing convention or retune ALL its constants. ------------- */
const fallMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide, fog: false,
  uniforms: { uTime, uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY } },
  vertexShader: /* glsl */`
    varying vec2 vUv; varying vec3 vW;
    uniform float uTime;
    void main(){
      vUv = uv;
      vec3 p = position;
      float down = 1.0 - uv.y;
      p.z += 9.0 * (1.0 - exp(-down * 2.6));            /* arc away from the rim */
      p.x += sin(uTime*0.7 + uv.y*5.0) * 1.1 * down;     /* lazy ribbon wobble   */
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv; varying vec3 vW;
    uniform float uTime, uFogDensity;
    uniform vec3 uFogColor;
    ${GLSL_NOISE}
    ${GLSL_FOGF}
    void main(){
      float t = uTime;
      float streak = fbm(vec2(vUv.x*13.0, vUv.y*2.1 - t*0.9));
      float foam   = smoothstep(0.56, 0.92, fbm(vec2(vUv.x*8.0 + 3.0, vUv.y*6.5 - t*2.1)));
      vec3 col = mix(vec3(1.0, 0.62, 0.2), vec3(1.0, 0.88, 0.6), streak);
      col += vec3(1.0, 0.95, 0.8) * foam;
      col *= 1.0 + smoothstep(0.86, 1.0, vUv.y) * 0.55;   /* glowing lip */
      float edge = smoothstep(0.0, 0.2, vUv.x) * (1.0 - smoothstep(0.8, 1.0, vUv.x));
      float tail = smoothstep(0.0, 0.26, vUv.y);
      float a = edge * tail * (0.3 + streak*0.42 + foam*0.5);
      a *= 1.0 - fogFactor(distance(cameraPosition, vW), uFogDensity)*0.6;
      gl_FragColor = vec4(col * a * 1.05, a);
    }
  `
});

/* --- ember burst shader (fall bases) ------------------------- */
const emberUniformsShared = { uTime, uPx: { value: 900 } };
function makeEmbers(count, base, spread){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const dir = new Float32Array(count*3);
  const ph  = new Float32Array(count);
  const sz  = new Float32Array(count);
  for (let i = 0; i < count; i++){
    const a = R()*Math.PI*2, rr = Math.sqrt(R())*spread;
    pos[i*3]   = base.x + Math.cos(a)*rr;
    pos[i*3+1] = base.y + RR(-2, 4);
    pos[i*3+2] = base.z + Math.sin(a)*rr;
    const ca = R()*Math.PI*2, tilt = R()*0.35;
    dir[i*3]   = Math.sin(tilt)*Math.cos(ca);
    dir[i*3+1] = Math.cos(tilt);
    dir[i*3+2] = Math.sin(tilt)*Math.sin(ca);
    ph[i] = R();
    sz[i] = RR(1.4, 4.2);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aDir', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { ...emberUniformsShared, uTex: { value: texGlow } },
    vertexShader: /* glsl */`
      attribute vec3 aDir; attribute float aPhase; attribute float aSize;
      uniform float uTime, uPx;
      varying float vA;
      void main(){
        float life = fract(uTime*0.085 + aPhase);
        vec3 p = position + aDir * life * 85.0;
        p.x += sin(uTime*0.6 + aPhase*40.0) * 4.0 * life;
        p.z += cos(uTime*0.5 + aPhase*31.0) * 4.0 * life;
        vA = smoothstep(0.0, 0.12, life) * (1.0 - smoothstep(0.55, 1.0, life));
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * (1.0 + life*1.6) * uPx / -mv.z, 0.0, 96.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex;
      varying float vA;
      void main(){
        vec4 tex = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(1.0, 0.82, 0.5) * tex.a * vA * 1.6, tex.a * vA);
      }
    `
  });
  const pts = new THREE.Points(g, mat);
  pts.renderOrder = 9;
  pts.frustumCulled = false;
  return pts;
}

/* --- island wisp billboards (clouds hanging beneath) --------- */
function makeWisps(count, r){
  const plane = new THREE.PlaneGeometry(1, 1);
  const g = new THREE.InstancedBufferGeometry();
  g.index = plane.index;
  g.setAttribute('position', plane.attributes.position);
  g.setAttribute('uv', plane.attributes.uv);
  const orb = new Float32Array(count*4);   // radius, angle0, speed, height
  const par = new Float32Array(count*4);   // scale, alpha, rot, rotSpeed
  for (let i = 0; i < count; i++){
    orb[i*4]   = r * RR(0.55, 1.2);
    orb[i*4+1] = R() * Math.PI * 2;
    orb[i*4+2] = RR(0.015, 0.05) * (R() > 0.5 ? 1 : -1);
    orb[i*4+3] = -r * RR(0.25, 1.1);
    par[i*4]   = r * RR(0.55, 1.05);
    par[i*4+1] = RR(0.3, 0.62);
    par[i*4+2] = R() * Math.PI * 2;
    par[i*4+3] = RR(-0.05, 0.05);
  }
  g.setAttribute('aOrb', new THREE.InstancedBufferAttribute(orb, 4));
  g.setAttribute('aPar', new THREE.InstancedBufferAttribute(par, 4));
  g.instanceCount = count;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: {
      uTime, uTex: { value: texPuff },
      uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY },
    },
    vertexShader: /* glsl */`
      attribute vec4 aOrb; attribute vec4 aPar;
      uniform float uTime;
      varying vec2 vUv; varying float vAlpha; varying float vDist;
      varying vec3 vW; varying float vBack;
      void main(){
        vUv = uv;
        float ang = aOrb.y + uTime * aOrb.z;
        vec3 base = vec3(cos(ang)*aOrb.x, aOrb.w, sin(ang)*aOrb.x);
        vec4 wc = modelMatrix * vec4(base, 1.0);
        float rot = aPar.z + uTime * aPar.w;
        vec2 off = position.xy * aPar.x;
        off = mat2(cos(rot), -sin(rot), sin(rot), cos(rot)) * off;
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        wc.xyz += right*off.x + up*off.y;
        vW = wc.xyz;
        vBack = pow(max(dot(normalize(wc.xyz - cameraPosition), vec3(${SUN_DIR.x.toFixed(5)}, ${SUN_DIR.y.toFixed(5)}, ${SUN_DIR.z.toFixed(5)})), 0.0), 5.0);
        vec4 mv = viewMatrix * wc;
        vDist = -mv.z;
        vAlpha = aPar.y;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex;
      uniform vec3 uFogColor; uniform float uFogDensity;
      varying vec2 vUv; varying float vAlpha; varying float vDist;
      varying vec3 vW; varying float vBack;
      ${GLSL_FOGF}
      void main(){
        vec4 t = texture2D(uTex, vUv);
        float ff = fogFactor(vDist, uFogDensity);
        vec3 col = vec3(0.88, 0.7, 0.5);
        /* backlit silver-gold lining on the thin fringe of each puff */
        float rim = t.a * (1.0 - smoothstep(0.06, 0.35, t.a));
        col += vec3(1.35, 0.95, 0.55) * vBack * rim * 2.0;
        col = mix(col, fogTint(normalize(vW - cameraPosition), uFogColor), ff*0.9);
        float a = t.a * vAlpha * (1.0 - ff*0.5);
        if (a < 0.004) discard;
        gl_FragColor = vec4(col, a);
      }
    `
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.renderOrder = 6;
  mesh.frustumCulled = false;
  return mesh;
}

/* --- assemble each island ------------------------------------ */
const islandGroups = [];
const treeWorldPositions = [];
const fallInfos = [];  // for camera + pollen
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

for (const isl of ISLANDS){
  const group = new THREE.Group();
  group.position.set(isl.x, isl.y, isl.z);
  group.userData = {
    baseY: isl.y,
    bobAmp: RR(2.5, 5),
    bobSpeed: RR(0.16, 0.3),
    bobPhase: R()*Math.PI*2,
    yawAmp: RR(0.05, 0.11),
    yawSpeed: RR(0.05, 0.1),
    yawPhase: R()*Math.PI*2,
  };
  scene.add(group);
  islandGroups.push(group);

  const body = new THREE.Mesh(buildIslandGeometry(isl.r, isl.seed), islandMat);
  body.userData = { islandGroup: group, islandR: isl.r };   // clickable: behold this isle
  group.add(body);
  occluders.push(body);

  /* grass */
  const nGrass = Math.floor(isl.r * 7);
  const grass = new THREE.InstancedMesh(grassGeo, grassMat, nGrass);
  for (let i = 0; i < nGrass; i++){
    const a = R()*Math.PI*2, d = Math.sqrt(R())*0.86*isl.r;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    dummy.position.set(x, islandTopY(isl.r, isl.seed, x, z) - 0.15, z);
    dummy.rotation.set(RR(-0.14, 0.14), R()*Math.PI, RR(-0.14, 0.14));
    dummy.scale.setScalar(RR(0.7, 1.6));
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
    tmpColor.setHSL(0.105 + R()*0.035, RR(0.5, 0.66), RR(0.42, 0.52));
    grass.setColorAt(i, tmpColor);
  }
  grass.computeBoundingSphere(); grass.boundingSphere.radius += 2;   // sway margin; culls with the island
  group.add(grass);

  /* wildflowers */
  const nFl = Math.floor(isl.r * 1.2);
  const flowers = new THREE.InstancedMesh(flowerGeo, flowerMat, nFl);
  const flTints = [new THREE.Color(1.12, 1.08, 0.98), new THREE.Color(1.15, 0.95, 0.88), new THREE.Color(1.18, 1.04, 0.7)];
  for (let i = 0; i < nFl; i++){
    const a = R()*Math.PI*2, d = Math.sqrt(R())*0.8*isl.r;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    dummy.position.set(x, islandTopY(isl.r, isl.seed, x, z) + RR(0.3, 0.9), z);
    dummy.rotation.set(0, R()*Math.PI, 0);
    dummy.scale.setScalar(RR(0.7, 1.3));
    dummy.updateMatrix();
    flowers.setMatrixAt(i, dummy.matrix);
    flowers.setColorAt(i, flTints[(R()*3)|0]);
  }
  flowers.computeBoundingSphere(); flowers.boundingSphere.radius += 2;
  group.add(flowers);

  /* flowering vines draped over the rim */
  const nVine = Math.max(6, Math.floor(isl.r * 0.45));
  const vines = new THREE.InstancedMesh(vineGeo, vineMat, nVine);
  for (let i = 0; i < nVine; i++){
    const a = R()*Math.PI*2;
    const [px, py, pz] = undersidePoint(isl.r, isl.seed, a, -0.04);
    dummy.position.set(px*1.01, py + 0.5, pz*1.01);
    dummy.rotation.set(0, -a + Math.PI/2 + RR(-0.4, 0.4), RR(-0.12, 0.12));
    dummy.scale.setScalar(RR(0.7, 1.5));
    dummy.updateMatrix();
    vines.setMatrixAt(i, dummy.matrix);
  }
  vines.computeBoundingSphere(); vines.boundingSphere.radius += 2.5;   // vines sway furthest
  group.add(vines);

  /* soft white stones breaking through the meadow */
  const nRock = Math.max(5, (isl.r * 0.24)|0);
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, nRock);
  for (let i = 0; i < nRock; i++){
    const a = R()*Math.PI*2, d = Math.sqrt(R())*0.78*isl.r;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    const sy = RR(0.5, 1.4);
    dummy.position.set(x, islandTopY(isl.r, isl.seed, x, z) - sy*0.35, z);
    dummy.rotation.set(R()*Math.PI, R()*Math.PI, R()*Math.PI);
    dummy.scale.set(RR(0.7, 2.2), sy, RR(0.7, 2.2));
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  }
  rocks.computeBoundingSphere(); rocks.boundingSphere.radius += 1;
  group.add(rocks);

  /* crystals: hanging clusters beneath + a few sprouting on top */
  const shards = [];
  const nCluster = 5 + ((isl.r/18)|0);
  for (let c = 0; c < nCluster; c++){
    const a = R()*Math.PI*2, ny = RR(-0.82, -0.3);
    const [px, py, pz] = undersidePoint(isl.r, isl.seed, a, ny);
    const nShard = 2 + (R()*3|0);
    for (let sIdx = 0; sIdx < nShard; sIdx++){
      shards.push({
        p: [px + RR(-5,5), py + RR(-4,2), pz + RR(-5,5)],
        rot: [Math.PI + RR(-0.5, 0.5), R()*Math.PI*2, RR(-0.5, 0.5)],
        s: RR(1.6, 4.4) * (isl.r/55),
      });
    }
  }
  for (let c = 0; c < 3; c++){
    const a = R()*Math.PI*2, d = RR(0.55, 0.8)*isl.r;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    shards.push({
      p: [x, islandTopY(isl.r, isl.seed, x, z), z],
      rot: [RR(-0.35, 0.35), R()*Math.PI*2, RR(-0.35, 0.35)],
      s: RR(0.7, 1.7),
    });
  }
  const crystals = new THREE.InstancedMesh(crystalGeoBase, crystalMat, shards.length);
  shards.forEach((sh, i) => {
    dummy.position.set(...sh.p);
    dummy.rotation.set(...sh.rot);
    dummy.scale.set(sh.s, sh.s*RR(0.9, 1.5), sh.s);
    dummy.updateMatrix();
    crystals.setMatrixAt(i, dummy.matrix);
  });
  crystals.computeBoundingSphere(); crystals.boundingSphere.radius += 2;
  group.add(crystals);

  /* one great tree */
  {
    const a = R()*Math.PI*2, d = RR(0.15, 0.4)*isl.r;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    const tree = new THREE.Mesh(treeGeo, treeMatProto);
    tree.position.set(x, islandTopY(isl.r, isl.seed, x, z) - 0.4, z);
    tree.rotation.y = R()*Math.PI*2;
    tree.scale.setScalar(isl.tree);
    group.add(tree);
    treeWorldPositions.push(new THREE.Vector3(isl.x + x, isl.y + tree.position.y + 20*isl.tree, isl.z + z));
  }

  /* cloud wisps hanging beneath */
  group.add(makeWisps(6 + (isl.r/16|0), isl.r));

  /* waterfall of liquid gold light + ember burst at its base */
  if (isl.fall){
    /* the hero island's fall is pinned where the camera dive passes */
    const a = (isl === ISLANDS[0]) ? -2.08 : R()*Math.PI*2;
    const [px, py, pz] = undersidePoint(isl.r, isl.seed, a, -0.1);
    const topY = py - 1;
    const height = (isl.y + topY) - (MIST_Y + 4);
    const width = isl.r * RR(0.22, 0.3);
    const fg = new THREE.PlaneGeometry(width, height, 1, 24);
    fg.translate(0, -height/2, 0);
    const fall = new THREE.Mesh(fg, fallMat);
    const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
    fall.position.set(px + out.x*2, topY, pz + out.z*2);
    fall.rotation.y = Math.PI/2 - a;
    fall.renderOrder = 8;
    fall.frustumCulled = false;
    group.add(fall);
    const base = new THREE.Vector3(px + out.x*10, MIST_Y + 8 - isl.y, pz + out.z*10);
    group.add(makeEmbers(90, base, width*1.4));
    /* impact coronas: slow rings of light spreading where the fall meets the mist */
    {
      const ringMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
        uniforms: { uTime, uPhase: { value: R() } },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */`
          varying vec2 vUv;
          uniform float uTime, uPhase;
          void main(){
            vec2 q = vUv*2.0 - 1.0;
            float r = length(q);
            float a = 0.0;
            for (int i = 0; i < 2; i++){
              float ph = fract(uTime*0.21 + uPhase + float(i)*0.5);
              float d = abs(r - ph*0.92);
              a += smoothstep(0.10, 0.0, d) * (1.0 - ph) * (1.0 - ph);
            }
            a *= smoothstep(1.0, 0.85, r) * 0.18;   /* emit alpha once; quiet enough to read as glow on the mist, not a floating hoop */
            gl_FragColor = vec4(vec3(1.0, 0.88, 0.62), a);
          }
        `
      });
      const ringGeo = new THREE.PlaneGeometry(width*3.2, width*3.2);
      ringGeo.rotateX(-Math.PI/2);
      const rings = new THREE.Mesh(ringGeo, ringMat);
      rings.position.set(base.x, base.y + 1.5, base.z);
      rings.renderOrder = 9;
      rings.frustumCulled = false;
      group.add(rings);
    }
    fallInfos.push({ island: isl, angle: a, top: new THREE.Vector3(isl.x + px, isl.y + topY, isl.z + pz) });
  }
}

/* ============================================================
   7. Cloud strata / drifting mist banks / mist floor
   ============================================================ */
function makeDriftClouds({ count, yMin, yMax, sMin, sMax, alpha, lantern, span, zMin, zMax, order }){
  const plane = new THREE.PlaneGeometry(1, 1);
  const g = new THREE.InstancedBufferGeometry();
  g.index = plane.index;
  g.setAttribute('position', plane.attributes.position);
  g.setAttribute('uv', plane.attributes.uv);
  const aPos  = new Float32Array(count*3);
  const aPar  = new Float32Array(count*4);  // scale, alpha, rot, rotSpeed
  const aTint = new Float32Array(count*3);
  const aSpd  = new Float32Array(count);
  for (let i = 0; i < count; i++){
    aPos[i*3]   = RR(-span, span);
    aPos[i*3+1] = RR(yMin, yMax);
    aPos[i*3+2] = RR(zMin, zMax);
    aPar[i*4]   = RR(sMin, sMax);
    aPar[i*4+1] = alpha * RR(0.6, 1.2);
    aPar[i*4+2] = R()*Math.PI*2;
    aPar[i*4+3] = RR(-0.02, 0.02);
    const lit = R() < lantern;
    const c = lit ? [RR(1.4,1.8), RR(0.95,1.2), RR(0.5,0.7)] : [RR(0.78,0.9), RR(0.6,0.72), RR(0.42,0.55)];
    aTint[i*3] = c[0]; aTint[i*3+1] = c[1]; aTint[i*3+2] = c[2];
    aSpd[i] = RR(3, 13);
  }
  g.setAttribute('aPos',  new THREE.InstancedBufferAttribute(aPos, 3));
  g.setAttribute('aPar',  new THREE.InstancedBufferAttribute(aPar, 4));
  g.setAttribute('aTint', new THREE.InstancedBufferAttribute(aTint, 3));
  g.setAttribute('aSpd',  new THREE.InstancedBufferAttribute(aSpd, 1));
  g.instanceCount = count;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: {
      uTime, uTex: { value: texPuff }, uSpan: { value: span },
      uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY },
    },
    vertexShader: /* glsl */`
      attribute vec3 aPos; attribute vec4 aPar; attribute vec3 aTint; attribute float aSpd;
      uniform float uTime, uSpan;
      varying vec2 vUv; varying float vAlpha; varying float vDist; varying vec3 vTint;
      varying vec3 vW; varying float vBack;
      void main(){
        vUv = uv; vTint = aTint;
        vec3 base = aPos;
        base.x = mod(base.x + uTime*aSpd + uSpan, uSpan*2.0) - uSpan;
        float edgeFade = 1.0 - smoothstep(uSpan*0.82, uSpan, abs(base.x));
        float rot = aPar.z + uTime*aPar.w;
        vec2 off = position.xy * aPar.x;
        off = mat2(cos(rot), -sin(rot), sin(rot), cos(rot)) * off;
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vec3 wp = base + right*off.x + up*off.y;
        vW = wp;
        vBack = pow(max(dot(normalize(wp - cameraPosition), vec3(${SUN_DIR.x.toFixed(5)}, ${SUN_DIR.y.toFixed(5)}, ${SUN_DIR.z.toFixed(5)})), 0.0), 5.0);
        vec4 mv = viewMatrix * vec4(wp, 1.0);
        vDist = -mv.z;
        vAlpha = aPar.y * edgeFade;   /* no pop when a puff wraps around */
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex;
      uniform vec3 uFogColor; uniform float uFogDensity;
      varying vec2 vUv; varying float vAlpha; varying float vDist; varying vec3 vTint;
      varying vec3 vW; varying float vBack;
      ${GLSL_FOGF}
      void main(){
        vec4 t = texture2D(uTex, vUv);
        float ff = fogFactor(vDist, uFogDensity);
        vec3 col = vTint;
        /* backlit silver-gold lining — real cumulus at golden hour */
        float rim = t.a * (1.0 - smoothstep(0.06, 0.35, t.a));
        col += vec3(1.35, 0.95, 0.55) * vBack * rim * 2.0;
        col = mix(col, fogTint(normalize(vW - cameraPosition), uFogColor), ff*0.85);
        float a = t.a * vAlpha * (1.0 - ff*0.55);
        if (a < 0.004) discard;

        col *= 0.80 + 0.30*smoothstep(0.3, 0.7, shade);
        float edge = 1.0 - smoothstep(0.28, 0.5, distance(vUv, vec2(0.5)));
        float a = (0.5 + 0.36*n + 0.2*n2) * edge;
        float ff = fogFactor(distance(cameraPosition, vW), uFogDensity);

{

    gr.addColorStop(0,    'rgba(255,255,255,0.95)');
    gr.addColorStop(0.62, 'rgba(255,255,255,0.75)');
    gr.addColorStop(1,    'rgba(255,255,255,0)');

    g.restore();
    g.save();                                   /* tapering underside */

    gr.addColorStop(0,    'rgba(255,255,255,0.85)');

  };

function buildGate(){
  const group = new THREE.Group();
  group.position.copy(GATE_POS);
  const geoms = [];
  const addShard = (x, y, z, sx, sy, sz, ry, rz) => {
    const g = crystalGeoBase.clone();   // scale, then rotate, then translate
    g.scale(sx, sy, sz);
    g.rotateZ(rz); g.rotateY(ry);
    g.translate(x, y, z);
    geoms.push(g);
  };
  /* flanking spire clusters */
  for (const side of [-1, 1]){
    let x = side * 210;
    addShard(x, 60, 0, 60, 210, 60, R()*3, side*0.06);
    addShard(x + side*130, -20, 40, 48, 150, 48, R()*3, side*0.12);
    addShard(x + side*260, -60, -30, 40, 120, 40, R()*3, side*0.18);
    addShard(x - side*40, 170, -60, 34, 150, 34, R()*3, -side*0.05);
    addShard(x + side*180, 90, -90, 26, 110, 26, R()*3, side*0.1);
  }
  /* central spire behind the arch */
  addShard(0, 260, -120, 44, 240, 44, 0.4, 0);
  addShard(40, 150, -170, 26, 130, 26, 1.2, 0.1);
  addShard(-50, 130, -80, 22, 110, 22, 2.1, -0.1);
  /* the arch */
  {
    const torus = new THREE.TorusGeometry(170, 24, 8, 30, Math.PI);
    torus.translate(0, 40, 0);
    geoms.push(torus.toNonIndexed());
  }
  const merged = BufferGeometryUtils.mergeGeometries(geoms);
  merged.computeVertexNormals();
  const gateMat = crystalShader(420, 1.5, 0.62);
  const mesh = new THREE.Mesh(merged, gateMat);
  mesh.userData.isGate = true;   // clickable: begin the entry sequence
  group.add(mesh);
  occluders.push(mesh);

  /* the light within the gate */
  const portal = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texGlow, color: 0xffd393, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false, opacity: 0.75
  }));
  portal.position.set(0, 60, 0);
  portal.scale.setScalar(400);
  portal.material.opacity = 0.6;
  group.add(portal);
  const portalCore = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texGlow, color: 0xfff7e2, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false, opacity: 0.9
  }));
  portalCore.position.set(0, 50, 10);
  portalCore.scale.setScalar(170);
  group.add(portalCore);
  group.userData.portal = portal;         // the entry sequence swells these
  group.userData.portalCore = portalCore;

  /* the pillar of light — the portal's radiance rising into the sky */
  const pillarMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    side: THREE.DoubleSide,
    uniforms: { uTime },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      uniform float uTime;
      ${GLSL_NOISE}
      void main(){
        /* max() guards: GPU float error can push these a hair negative at the
           quad edges, and pow(negative) is NaN — bloom then smears it into
           huge black blocks. Never again. */
        float ex = max(sin(vUv.x*3.14159), 0.0);
        float flow = 0.75 + 0.25*fbm3o(vec2(vUv.x*3.0, vUv.y*6.0 - uTime*0.05));
        /* emit alpha once — additive blending applies it to the color */
        float a = pow(ex, 2.4) * pow(max(1.0 - vUv.y, 0.0), 1.6) * flow * 0.16;
        gl_FragColor = vec4(vec3(1.0, 0.85, 0.6), a);
      }
    `
  });
  const pillarGeo = new THREE.PlaneGeometry(150, 1500);
  pillarGeo.translate(0, 750, 0);
  for (const ry of [0, Math.PI/2]){
    const pl = new THREE.Mesh(pillarGeo, pillarMat);
    pl.position.set(0, 60, 0);
    pl.rotation.y = ry;
    pl.renderOrder = 12;
    pl.frustumCulled = false;
    group.add(pl);
  }

  scene.add(group);
  return group;
}

function makeMotes(count, center, size, color, pSize, alpha){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const ph  = new Float32Array(count);
  const sz  = new Float32Array(count);
  for (let i = 0; i < count; i++){
    pos[i*3]   = center[0] + RR(-size[0], size[0]);
    pos[i*3+1] = center[1] + RR(-size[1], size[1]);
    pos[i*3+2] = center[2] + RR(-size[2], size[2]);
    ph[i] = R()*Math.PI*2;
    sz[i] = pSize * RR(0.5, 1.6);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: {
      uTime, uPx: emberUniformsShared.uPx, uTex: { value: texStar },
      uColor: { value: new THREE.Color(color) }, uAlpha: { value: alpha },
    },
    vertexShader: /* glsl */`
      attribute float aPhase; attribute float aSize;
      uniform float uTime, uPx;
      varying float vA;
      void main(){
        vec3 p = position;
        p.x += sin(uTime*0.23 + aPhase)*8.0;
        p.y += sin(uTime*0.16 + aPhase*1.7)*6.0;
        p.z += cos(uTime*0.19 + aPhase*2.3)*8.0;
        vA = 0.35 + 0.65*pow(0.5 + 0.5*sin(uTime*2.4 + aPhase*5.0), 3.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPx / -mv.z, 0.0, 42.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex; uniform vec3 uColor; uniform float uAlpha;
      varying float vA;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(uColor * t.a * vA * uAlpha, t.a * vA * uAlpha);
      }
    `
  });
  const pts = new THREE.Points(g, mat);
  pts.renderOrder = 10;
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
}

function makeDrifters({ count, tex, size, area, yTop, yFall, tint, spin, sway }){
  const geo = new THREE.PlaneGeometry(size, size*1.6);

    map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    color: tint, fog: true, opacity: 0.9

  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);   // rewritten every frame

      x: RR(-area, area), z: RR(-area, area),
      phase: R(), speed: RR(0.014, 0.03),
      rx: R()*Math.PI*2, ry: R()*Math.PI*2,
      swayA: RR(8, 26), ph2: R()*Math.PI*2,
    });

  return { mesh, st, yTop, yFall, spin, sway,
    update(t){

        const life = (t*s.speed + s.phase) % 1;
        const y = yTop - life * yFall;
        dummy.position.set(
          s.x + Math.sin(t*0.4 + s.ph2)*s.swayA + Math.sin(t*1.3 + s.ph2*2.0)*3.0,

        dummy.rotation.set(s.rx + Math.sin(t*spin + s.ph2)*0.8, s.ry + t*spin*0.5, Math.sin(t*spin*1.3 + s.ph2)*0.7);
        const pop = Math.min(1, Math.min(life, 1-life)*12);
        dummy.scale.setScalar(pop);
        dummy.updateMatrix();
        this.mesh.setMatrixAt(i, dummy.matrix);
      }
      this.mesh.instanceMatrix.needsUpdate = true;
    }
  };

function updateLeaves(t, dt){
  for (let i = 0; i < LEAF_N; i++){
    const s = leafState[i];
    const life = (t*s.speed + s.phase) % 1;
    const respawn = life < s.lastLife - 0.5;   // life wrapped → pick a new tree
    s.lastLife = life;
    if (respawn) s.tree = (R()*treeWorldPositions.length)|0;
    const tp = treeWorldPositions[s.tree];
    s.pos.set(
      tp.x + Math.sin(life*9 + s.ph2)*7 + life*34*Math.sin(s.ph2),
      tp.y + 4 - life*150,
      tp.z + Math.cos(life*7 + s.ph2)*6 + life*34*Math.cos(s.ph2*1.3)
    );
    dummy.position.copy(s.pos);
    dummy.rotation.set(Math.sin(t*2.1 + s.ph2)*0.9, t*0.8 + s.ph2, Math.cos(t*1.7 + s.ph2)*0.8);
    const pop = Math.min(1, Math.min(life, 1-life)*10);
    dummy.scale.setScalar(pop);
    dummy.updateMatrix();
    leafMesh.setMatrixAt(i, dummy.matrix);
    /* trailing light: follow-chain; snap on respawn or any teleport-sized gap
       (tab restore) so the trail never streaks across the sky */
    const k = 1 - Math.exp(-dt*7);
    if (respawn || s.trail[0].y < -8000 || s.trail[0].distanceToSquared(s.pos) > 8100){
      for (const tr of s.trail) tr.copy(s.pos);
    }
    s.trail[0].lerp(s.pos, k);
    for (let j = 1; j < TRAIL_N; j++) s.trail[j].lerp(s.trail[j-1], k);
    for (let j = 0; j < TRAIL_N; j++){
      const idx = (i*TRAIL_N + j)*3;
      trailPos[idx] = s.trail[j].x; trailPos[idx+1] = s.trail[j].y; trailPos[idx+2] = s.trail[j].z;
    }
  }
  leafMesh.instanceMatrix.needsUpdate = true;
  trailGeo.attributes.position.needsUpdate = true;
}

function buildBirdGeometry(){
  const pos = [], wing = [];
  const tri = (a, b, c, w) => { pos.push(...a, ...b, ...c); wing.push(w[0], w[1], w[2]); };
  tri([0, 0.14, 1.25], [0, -0.16, 0.15], [0, 0.26, -1.2], [0, 0, 0]);   // keel body
  const A = [0.2, 0, 0.5], B = [0.2, 0, -0.42], M1 = [1.45, 0.05, 0.3], M2 = [1.5, 0.05, -0.62], T = [2.85, 0.1, -0.75];
  for (const s of [1, -1]){
    const a = [A[0]*s, A[1], A[2]], b = [B[0]*s, B[1], B[2]];
    const m1 = [M1[0]*s, M1[1], M1[2]], m2 = [M2[0]*s, M2[1], M2[2]], tp = [T[0]*s, T[1], T[2]];
    tri(a, m1, b, [0, 0.45, 0]);
    tri(b, m1, m2, [0, 0.45, 0.45]);
    tri(m1, tp, m2, [0.45, 1, 0.45]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('aWing', new THREE.BufferAttribute(new Float32Array(wing), 1));
  g.computeVertexNormals();
  return g;
}

    attribute float aWing;
    attribute float aPhase;

    varying vec3 vN; varying vec3 vW;
    void main(){

      p.y += flap * aWing * 0.75;

      vW = wp.xyz;

  `,

    varying vec3 vN; varying vec3 vW;

    void main(){
      float d = abs(dot(normalize(vN), uSunDir));
      vec3 col = vec3(1.15, 1.1, 1.0) * (0.72 + 0.55*d);
      float ff = fogFactor2(distance(cameraPosition, vW), uFogDensity, vW.y);
      col = mix(col, fogTint(normalize(vW - cameraPosition), uFogColor), ff*0.85);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const FLOCKS = [
  { n: 26, c: [40, 85, 40],     rx: 230, rz: 185, h: 26, w: 0.055,  ph: 0.0, scale: 1.25 },
  { n: 20, c: [240, 45, -230],  rx: 200, rz: 165, h: 40, w: -0.062, ph: 2.1, scale: 1.15 },
  { n: 18, c: [-225, 70, -10],  rx: 185, rz: 215, h: 32, w: 0.05,   ph: 4.2, scale: 1.2 },
];
const flockMeshes = [];
for (const f of FLOCKS){
  const mesh = new THREE.InstancedMesh(birdGeo, birdMat, f.n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);   // rewritten every frame
  mesh.frustumCulled = false;
  const phases = new Float32Array(f.n);
  const birds = [];
  for (let i = 0; i < f.n; i++){
    phases[i] = R()*Math.PI*2;
    birds.push({ trail: RR(0, 0.9), rJit: RR(-24, 24), hJit: RR(-14, 14), bobPh: R()*Math.PI*2, scale: f.scale*RR(0.8, 1.25) });
  }
  mesh.geometry = birdGeo.clone();
  mesh.geometry.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
  scene.add(mesh);
  flockMeshes.push({ mesh, f, birds });
}
const _bp = new THREE.Vector3(), _bv = new THREE.Vector3(), _bp2 = new THREE.Vector3();
function flockPos(f, b, s, out){
  out.set(
    f.c[0] + Math.cos(s)*(f.rx + b.rJit),
    f.c[1] + Math.sin(s*2 + f.ph)*f.h + b.hJit + Math.sin(s*7 + b.bobPh)*4,
    f.c[2] + Math.sin(s)*(f.rz + b.rJit)
  );
}
function updateBirds(t){
  for (const { mesh, f, birds } of flockMeshes){
    for (let i = 0; i < birds.length; i++){
      const b = birds[i];
      const s = t*f.w + f.ph - b.trail - i*0.028;
      flockPos(f, b, s, _bp);
      flockPos(f, b, s + 0.02*Math.sign(f.w), _bp2);
      _bv.subVectors(_bp2, _bp).normalize();
      dummy.position.copy(_bp);
      dummy.lookAt(_bp.x + _bv.x, _bp.y + _bv.y, _bp.z + _bv.z);
      dummy.rotateZ(Math.sign(f.w) * -0.35 + Math.sin(t*1.3 + b.bobPh)*0.15);
      dummy.scale.setScalar(b.scale);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
}

/* ============================================================
   11. Post-processing — warm bloom, grade, vignette
   ============================================================ */
/* HDR half-float target with 2x MSAA: thin grass blades, crystal facets and
   tree edges shimmer badly without multisampling. The last quality step
   turns MSAA off (see setPixelLevel). */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  type: THREE.HalfFloatType, samples: 2,
}));
composer.addPass(new RenderPass(scene, camera));
/* threshold 0.95: bloom hugs the genuinely hot things (sun, falls, portal)
   and stops grabbing sub-pixel meadow highlights, which reads as flicker */
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.58, 0.45, 0.95);
composer.addPass(bloom);
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uFlash: { value: 0 }, uAspect: { value: innerWidth/innerHeight },
    uSunScreen: { value: new THREE.Vector2(0.5, 0.5) }, uRayStrength: { value: 0 }, uTaps: { value: 20 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uFlash;
    uniform float uAspect;
    uniform vec2 uSunScreen;
    uniform float uRayStrength;
    uniform float uTaps;
    varying vec2 vUv;
    float hashG(vec2 p){ p = fract(p*vec2(123.34, 345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }
    void main(){
      /* filmic grade, pre-tonemap (HDR linear in, ACES + sRGB applied later) */
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      /* screen-space crepuscular rays — a dithered march toward the sun,
         born and killed by the same occlusion-smoothed flareVis the lens
         flare trusts, so they can never flicker independently of it */
      if (uRayStrength > 0.001){
        vec2 sv = (uSunScreen - vUv) / uTaps;
        vec2 pos = vUv + sv * hashG(gl_FragCoord.xy + 7.0);   /* dither start: banding becomes fine noise */
        vec3 acc = vec3(0.0);
        float wsum = 0.0, w = 1.0;
        for (int i = 0; i < 24; i++){
          if (float(i) >= uTaps) break;
          vec3 s = texture2D(tDiffuse, pos).rgb;
          float lum = dot(s, vec3(0.2126, 0.7152, 0.0722));
          acc += s * smoothstep(0.55, 1.0, lum) * w;
          wsum += w;
          w *= 0.82;
          pos += sv;
        }
        c += (acc / max(wsum, 1e-4)) * vec3(1.0, 0.78, 0.5) * uRayStrength;
      }
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      /* vibrance — quiet pixels gain color, loud ones are left alone */
      float sat = length(c - vec3(l)) / max(l, 1e-4);
      c = mix(vec3(l), c, 1.0 + 0.14*(1.0 - smoothstep(0.0, 0.9, sat)));
      /* split-tone about the luminance pivot: violet-rose shadows, champagne light */
      float w = smoothstep(0.18, 0.85, l);
      c *= mix(vec3(1.010, 0.965, 1.045), vec3(1.045, 1.005, 0.905), w);
      c *= vec3(1.05, 0.99, 0.90);                             /* golden-white base   */
      c += vec3(0.020, 0.011, 0.003) * max(0.0, 1.0 - l*2.4);  /* gold in the shadows */
      /* highlight rolloff: the hottest light desaturates toward white —
         it reads as radiance, not orange clip */
      float hot = smoothstep(1.1, 3.2, l);
      c = mix(c, vec3(max(l, 1.0)), hot*0.6);
      /* aspect-true vignette — rational falloff, no corner crush */
      vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0);
      float r2 = dot(q, q) / (0.25 * (uAspect*uAspect + 1.0));
      c *= 0.82 + 0.22 / (1.0 + 2.6*r2*r2);
      c = mix(c, vec3(1.0, 0.97, 0.9), uFlash);                /* portal white-out */
      /* end-of-pass dither: none of the smooth gradients above may ever band */
      c += (hashG(gl_FragCoord.xy) - 0.5) * 0.004;
      gl_FragColor = vec4(c, 1.0);
    }
  `
});
composer.addPass(gradePass);
const gradeUniforms = gradePass.uniforms;   // ShaderPass clones the literal — hold the live copy
composer.addPass(new OutputPass());

const TOUR_SECONDS = 170;

const tour = { t: 0 };
const lookSmooth = lookCurve.getPoint(0).clone();
const camSmooth  = camCurve.getPointAt(0).clone();

const fly = {
  on: false, yaw: 0, pitch: 0,

const hintEl = document.getElementById('hint');
let hintTimer = 0;
function showHint(text){

const TOUR_HINT = 'cinematic tour — C to fly free · click an isle to behold it · E to enter the gate · M sound · H help';
let FLY_HINT = 'free flight — click to look · WASD move · Space up · Q down · Shift fast · C to return';
/* where the browser can tell us, name the keys as they appear on the user's

  navigator.keyboard.getLayoutMap().then(map => {

  }).catch(() => {});
}
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
showHint(TOUR_HINT);

function setFly(on){
  if (fly.on === on) return;
  fly.on = on;
  if (on){
    focus.island = null;
    fly.pos.copy(camera.position);
    const e2 = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    fly.yaw = e2.y; fly.pitch = e2.x;

  } else {

addEventListener('keydown', (e) => {
  if (e.code !== 'KeyM') ensureAudio();   // any gesture wakes the sound; M manages it itself
  if (e.code === 'KeyC' && !e.repeat && !portalSeq.on) setFly(!fly.on);
  if (e.code === 'KeyE' && !e.repeat && !portalSeq.on) startPortal();
  if (e.code === 'KeyH' && !e.repeat) showHint(fly.on ? FLY_HINT : TOUR_HINT);

addEventListener('keyup', (e) => { fly.keys[e.code] = false; });

/* click-to-look must never fail silently: the browser refuses pointer lock
   for ~1.25s after Esc and whenever the window lacks focus. Until the lock
   lands, holding the button drags the view, so looking always works. */
let dragLook = null;
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) dragLook = null;   // lock landed — no drag jump
  else if (fly.on) showHint('mouse released — click to look again · C to return to the tour');

  if (!fly.on){
    /* on the tour: clicks reach into the world — isles and the gate answer */
    if (!portalSeq.on) actOn(pickAt(e.clientX, e.clientY));
    return;
  }
  if (!document.pointerLockElement){
    dragLook = { x: e.clientX, y: e.clientY };
    if (e.pointerType === 'mouse'){

addEventListener('pointermove', (e) => {
  if (!fly.on) return;
  if (document.pointerLockElement === renderer.domElement){
    fly.yaw   -= e.movementX * 0.0021;
    fly.pitch -= e.movementY * 0.0021;
  } else if (dragLook && e.buttons & 1){
    fly.yaw   -= (e.clientX - dragLook.x) * 0.0035;
    fly.pitch -= (e.clientY - dragLook.y) * 0.0035;
    dragLook.x = e.clientX; dragLook.y = e.clientY;
