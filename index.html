addEventListener('pointerup',     () => { dragLook = null; });
addEventListener('pointercancel', () => { dragLook = null; });

/* ---- beholding an isle & entering the Source ----------------- */
const focus = { island: null, angle: 0 };
const portalSeq = { on: false, s: 0, from: new THREE.Vector3() };
const PORTAL_CENTER = GATE_POS.clone().add(new THREE.Vector3(0, 60, 0));
const clickRay = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
function pickAt(cx, cy){
  _ndc.set((cx/innerWidth)*2 - 1, -(cy/innerHeight)*2 + 1);
  clickRay.setFromCamera(_ndc, camera);
  clickRay.far = 4000;
  const hit = clickRay.intersectObjects(occluders, false)[0];
  return hit ? hit.object : null;
}
function actOn(obj){
  if (!obj){
    if (focus.island){ focus.island = null; showHint(TOUR_HINT); }
    return;
  }
  if (obj.userData.isGate) startPortal();
  else if (obj.userData.islandGroup){
    if (focus.island === obj){ focus.island = null; showHint(TOUR_HINT); }
    else {
      focus.island = obj;
      const g = obj.userData.islandGroup;
      /* begin the orbit from the camera's present bearing — no swing-around */
      focus.angle = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
      audioChime();
      showHint('beholding the isle — click it again, or the open sky, to drift on');
    }
  }
}
function startPortal(){
  if (portalSeq.on) return;
  portalSeq.on = true;
  portalSeq.s = 0;
  portalSeq.from.copy(camera.position);
  focus.island = null;
  fly.on = false;
  if (document.pointerLockElement) document.exitPointerLock();
  audioPortal(true);
  showHint('the Source calls…');
}
function abortPortal(){
  portalSeq.on = false;
  audioPortal(false);
  gradeUniforms.uFlash.value = 0;
  const pu = gate.userData;
  pu.portal.material.opacity = 0.6;
  pu.portalCore.material.opacity = 0.9;
  pu.portalCore.scale.setScalar(170);
  camSmooth.copy(camera.position);
  showHint(TOUR_HINT);
}
const _pv = new THREE.Vector3(), _lv = new THREE.Vector3(), _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
function updatePortalSeq(dt){
  portalSeq.s += dt / 9;                       // nine seconds from call to threshold
  const s = Math.min(1, portalSeq.s);
  const e = s*s*(3 - 2*s);
  /* quadratic bezier: here → a high staging point before the arch → just past its heart */
  _p1.set(PORTAL_CENTER.x, PORTAL_CENTER.y + 70, PORTAL_CENTER.z + 640);
  _p2.set(PORTAL_CENTER.x, PORTAL_CENTER.y, PORTAL_CENTER.z - 40);
  const a = 1 - e;
  _pv.set(0, 0, 0)
     .addScaledVector(portalSeq.from, a*a)
     .addScaledVector(_p1, 2*a*e)
     .addScaledVector(_p2, e*e);
  camera.position.copy(_pv);
  camSmooth.copy(_pv);
  _lv.copy(PORTAL_CENTER); _lv.z -= 260;       // gaze through the light, not at it
  camera.lookAt(_lv);
  lookSmooth.copy(_lv);
  /* the light rises to meet you */
  const pu = gate.userData;
  pu.portal.material.opacity = 0.6 + e*0.4;
  pu.portalCore.material.opacity = Math.min(1, 0.9 + e*0.1);
  pu.portalCore.scale.setScalar(170 * (1 + e*1.7));
  gradeUniforms.uFlash.value = THREE.MathUtils.smoothstep(s, 0.84, 1.0);
  if (portalSeq.s >= 1.16){
    /* through the white — and the isles receive you again at the tour's dawn */
    portalSeq.on = false;
    gradeUniforms.uFlash.value = 1;            // eases back to the world in the main loop
    pu.portal.material.opacity = 0.6;
    pu.portalCore.material.opacity = 0.9;
    pu.portalCore.scale.setScalar(170);
    window.__heaven.setTour(0.001);
    audioPortal(false);
    showHint('…and the isles receive you again');
  }
}

/* ---- PS5 DualSense / any standard-mapping gamepad ------------- */
const pad = { move: new THREE.Vector3(), fast: false };
let padIndex = null;
const padPrev = {};
addEventListener('gamepadconnected', (e) => {
  padIndex = e.gamepad.index;
  showHint('controller — sticks fly · ✕ behold / enter · ◯ tour · R2 rise · L2 sink · R1 fast');
});
addEventListener('gamepaddisconnected', (e) => { if (e.gamepad.index === padIndex) padIndex = null; });
const stickDz = v => Math.abs(v) < 0.13 ? 0 : (v - Math.sign(v)*0.13)/0.87;
function pollPad(dt){
  if (padIndex === null || portalSeq.on) return;
  const gp = navigator.getGamepads && navigator.getGamepads()[padIndex];
  if (!gp) return;
  const lx = stickDz(gp.axes[0] || 0), ly = stickDz(gp.axes[1] || 0);
  const rx = stickDz(gp.axes[2] || 0), ry = stickDz(gp.axes[3] || 0);
  const pressed = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const edge = i => { const now = pressed(i), was = padPrev[i]; padPrev[i] = now; return now && !was; };
  /* stick motion wakes free flight from the tour */
  if (!fly.on && !focus.island && (lx || ly || rx || ry)) setFly(true);
  if (fly.on){
    /* squared response: precise near center, swift at the rim */
    fly.yaw   -= rx*Math.abs(rx) * 2.6 * dt;
    fly.pitch -= ry*Math.abs(ry) * 1.9 * dt;
    fly.pitch = Math.max(-1.5, Math.min(1.5, fly.pitch));
    pad.move.set(lx, (gp.buttons[7] ? gp.buttons[7].value : 0) - (gp.buttons[6] ? gp.buttons[6].value : 0), ly);
    pad.fast = pressed(5);
  } else {
    pad.move.set(0, 0, 0);
    pad.fast = false;
  }
  if (edge(0)) actOn(pickAt(innerWidth/2, innerHeight/2));       // ✕ — behold what you face
  if (edge(1)){ if (fly.on) setFly(false); else if (focus.island){ focus.island = null; showHint(TOUR_HINT); } }  // ◯ — back to the tour
  if (edge(9)) setFly(!fly.on);                                  // Options — toggle flight
}

const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _mv = new THREE.Vector3();
function updateCamera(t, dt){
  if (portalSeq.on){ updatePortalSeq(dt); return; }
  if (fly.on){
    camera.rotation.set(fly.pitch, fly.yaw, 0, 'YXZ');
    _fwd.set(-Math.sin(fly.yaw)*Math.cos(fly.pitch), Math.sin(fly.pitch), -Math.cos(fly.yaw)*Math.cos(fly.pitch));
    _rgt.set(Math.cos(fly.yaw), 0, -Math.sin(fly.yaw));
    _mv.set(0, 0, 0);
    if (fly.keys['KeyW']) _mv.add(_fwd);
    if (fly.keys['KeyS']) _mv.sub(_fwd);
    if (fly.keys['KeyD']) _mv.add(_rgt);
    if (fly.keys['KeyA']) _mv.sub(_rgt);
    if (fly.keys['Space']) _mv.y += 1;
    if (fly.keys['KeyQ']) _mv.y -= 1;
    if (pad.move.lengthSq() > 0){
      /* analog: forward is stick-up (negative y-axis), magnitude preserved */
      _mv.addScaledVector(_fwd, -pad.move.z);
      _mv.addScaledVector(_rgt, pad.move.x);
      _mv.y += pad.move.y;
    }
    const speed = (fly.keys['ShiftLeft'] || fly.keys['ShiftRight'] || pad.fast) ? 160 : 55;
    if (_mv.lengthSq() > 0){
      if (_mv.lengthSq() > 1) _mv.normalize();   // keyboard diagonals cap at 1; analog keeps its finesse
      fly.pos.addScaledVector(_mv, speed*dt);
    }
    camera.position.copy(fly.pos);
    camSmooth.copy(camera.position);
    return;
  }
  if (focus.island){
    /* glide into a slow orbit around the chosen isle, gaze on its heart */
    const g = focus.island.userData.islandGroup;
    const r = focus.island.userData.islandR;
    focus.angle += dt*0.07;
    const d = r*2.6 + 26;
    _pv.set(g.position.x + Math.sin(focus.angle)*d,
            g.position.y + r*0.75 + 14,
            g.position.z + Math.cos(focus.angle)*d);
    _lv.set(g.position.x, g.position.y + r*0.18, g.position.z);
    const kp = 1 - Math.exp(-dt*1.6);
    const kl = 1 - Math.exp(-dt*2.2);
    camSmooth.lerp(_pv, kp);
    lookSmooth.lerp(_lv, kl);
    camera.position.copy(camSmooth);
    camera.lookAt(lookSmooth);
    return;
  }
  tour.t = (tour.t + dt / (REDUCED_MOTION ? TOUR_SECONDS*2 : TOUR_SECONDS)) % 1;
  const p = camCurve.getPointAt(tour.t);
  /* keep the gaze in lockstep with the camera's control points: convert the
     arc-length parameter into segment space and sample the look curve there */
  const seg = camCurve.getUtoTmapping(tour.t, 0);
  const l = lookCurve.getPoint((seg + 0.002) % 1);
  if (!REDUCED_MOTION){
    /* gentle handheld sway */
    p.x += Math.sin(t*0.31)*1.4; p.y += Math.sin(t*0.23)*1.0; p.z += Math.cos(t*0.27)*1.4;
  }
  const kp = 1 - Math.exp(-dt*3.2);
  const kl = 1 - Math.exp(-dt*2.4);
  camSmooth.lerp(p, kp);
  lookSmooth.lerp(l, kl);
  camera.position.copy(camSmooth);
  camera.lookAt(lookSmooth);
}

/* ============================================================
   12.7 The sound of Heaven — a constant glowing drone.
   Faint opera heard through light: synthesized "ahh" choir voices on open
   fifths that never resolve into tension, breathing in slow swells inside a
   cathedral of reverb, with high shimmer-air above, wind that rises when you
   fly, waterfall sparkle that grows as you near the falls, a soft bell when
   you behold an isle, and a rising radiance through the portal. Everything
   procedural — zero assets — and everything FAINT. M to hush it.
   ============================================================ */
const audio = { on: false, muted: false, ctx: null, master: null, choirGain: null,
                windGain: null, windSpeed: 0, fallGain: null, analyser: null,
                voices: [], chord: 0, chordTimer: 0, portalV: null };
const aRng = mulberry32(777);
const AR = () => aRng();

/* consonant progression over a D pedal — degrees in semitones from D3.
   Voice-led: each voice glides to its column's next value, nothing jumps. */
const CHORDS = [
  [-12, 0, 7, 12, 21],    // D  pedal · D A D' A''-3 (open, home)
  [-12, 0, 9, 16, 21],    // B minor-ish glow over the pedal
  [-12, -3, 5, 12, 19],   // G major color, still rooted
  [-12, 0, 7, 14, 23],    // D with a lifted 9th — hope, not tension
];
const D3 = 146.83;
const semi = n => D3 * Math.pow(2, n / 12);

function makeNoiseBuffer(ctx, seconds){
  const buf = ctx.createBuffer(2, (ctx.sampleRate * seconds) | 0, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = AR() * 2 - 1;
  }
  return buf;
}
function makeCathedralIR(ctx){
  /* decorrelated stereo noise under an exponential decay, softly lowpassed —
     a 5-second stone nave, generated instead of downloaded */
  const secs = 5, len = (ctx.sampleRate * secs) | 0;
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++){
      const t = i / len;
      const k = 0.12 + 0.5 * t;                       // darkens as it dies away
      lp += ((AR() * 2 - 1) - lp) * (1 - k);
      d[i] = lp * Math.pow(1 - t, 2.2) * 0.5;
    }
  }
  return buf;
}
function makeChoirVoice(ctx, dest, freq, level){
  /* two detuned triangles through an "ahh" formant bank, with slow vibrato
     and its own breathing LFO — one far-away singer */
  const vg = ctx.createGain();
  vg.gain.value = level;
  const formants = [[760, 9, 1.0], [1180, 10, 0.42], [2850, 12, 0.14]];
  const bank = formants.map(([f, q, g]) => {
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f * (0.94 + AR()*0.12); bp.Q.value = q;
    const fg = ctx.createGain(); fg.gain.value = g;
    bp.connect(fg).connect(vg);
    return bp;
  });
  const oscs = [-3.5, 3.5].map(cents => {
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = freq;
    o.detune.value = cents;
    for (const bp of bank) o.connect(bp);
    return o;
  });
  /* vibrato — slow and shallow, an opera singer at the horizon */
  const vib = ctx.createOscillator();
  vib.frequency.value = 4.6 + AR()*1.2;
  const vibG = ctx.createGain();
  vibG.gain.value = 2.5 + AR()*2;                     // cents
  vib.connect(vibG);
  for (const o of oscs) vibG.connect(o.detune);
  /* breath — each voice swells on its own slow tide */
  const br = ctx.createOscillator();
  br.frequency.value = 0.03 + AR()*0.05;
  const brG = ctx.createGain();
  brG.gain.value = level * 0.45;
  br.connect(brG).connect(vg.gain);
  vg.connect(dest);
  for (const o of [...oscs, vib, br]) o.start();
  return { oscs, gain: vg };
}
function ensureAudio(){
  if (audio.on) return;
  audio.on = true;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  audio.ctx = ctx;
  if (ctx.state === 'suspended') ctx.resume();

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -26; comp.knee.value = 22; comp.ratio.value = 3;
  comp.attack.value = 0.08; comp.release.value = 0.4;
  audio.master = ctx.createGain();
  audio.master.gain.value = 0;                        // faded in below
  audio.analyser = ctx.createAnalyser();
  audio.analyser.fftSize = 2048;
  audio.master.connect(comp).connect(audio.analyser).connect(ctx.destination);

  /* the nave: everything sings into the same stone */
  const verb = ctx.createConvolver();
  verb.buffer = makeCathedralIR(ctx);
  const wet = ctx.createGain(); wet.gain.value = 0.62;
  const dry = ctx.createGain(); dry.gain.value = 0.42;
  verb.connect(wet).connect(audio.master);
  dry.connect(audio.master);
  const room = ctx.createGain();                      // sources feed this
  room.connect(verb); room.connect(dry);

  /* choir on the opening chord */
  audio.choirGain = ctx.createGain();
  audio.choirGain.gain.value = 1;
  audio.choirGain.connect(room);
  const levels = [0.120, 0.100, 0.086, 0.062, 0.034]; // low pedal loudest, top faintest
  audio.voices = CHORDS[0].map((n, i) => makeChoirVoice(ctx, audio.choirGain, semi(n), levels[i]));

  /* shimmer-air: the glow above the voices */
  const noise = ctx.createBufferSource();
  noise.buffer = makeNoiseBuffer(ctx, 4);
  noise.loop = true;
  const airHp = ctx.createBiquadFilter();
  airHp.type = 'highpass'; airHp.frequency.value = 5800;
  const airG = ctx.createGain(); airG.gain.value = 0.02;
  noise.connect(airHp).connect(airG).connect(room);
  noise.start();

  /* wind: rises when you fly */
  const wind = ctx.createBufferSource();
  wind.buffer = makeNoiseBuffer(ctx, 6);
  wind.loop = true;
  const windBp = ctx.createBiquadFilter();
  windBp.type = 'bandpass'; windBp.frequency.value = 480; windBp.Q.value = 0.6;
  const windLfo = ctx.createOscillator(); windLfo.frequency.value = 0.07;
  const windLfoG = ctx.createGain(); windLfoG.gain.value = 160;
  windLfo.connect(windLfoG).connect(windBp.frequency); windLfo.start();
  audio.windGain = ctx.createGain(); audio.windGain.gain.value = 0.028;
  wind.connect(windBp).connect(audio.windGain).connect(room);
  wind.start();

  /* waterfall sparkle: gain driven by proximity every frame */
  const falls = ctx.createBufferSource();
  falls.buffer = makeNoiseBuffer(ctx, 5);
  falls.loop = true;
  const fallBp = ctx.createBiquadFilter();
  fallBp.type = 'bandpass'; fallBp.frequency.value = 2900; fallBp.Q.value = 1.8;
  audio.fallGain = ctx.createGain(); audio.fallGain.gain.value = 0;
  falls.connect(fallBp).connect(audio.fallGain).connect(room);
  falls.start();

  /* the world fades in over six seconds — no downbeat, it was always there */
  audio.master.gain.setTargetAtTime(0.75, ctx.currentTime + 0.1, 2.2);
  audio.room = room;
  showHint('the isles are singing — M to hush them');
}
function audioChime(){
  /* a soft far bell for beholding an isle */
  if (!audio.on || audio.muted) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  for (const [ratio, g, tau] of [[1, 0.075, 1.6], [2.756, 0.027, 1.1], [5.404, 0.012, 0.7]]){
    const o = ctx.createOscillator();
    o.frequency.value = 587.33 * ratio * (1 + (AR() - 0.5) * 0.004);   // D5 partials
    const og = ctx.createGain();
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(g, t + 0.02);
    og.gain.setTargetAtTime(0, t + 0.05, tau * 0.33);
    o.connect(og).connect(audio.room);
    o.start(t); o.stop(t + tau * 3);
  }
}
function audioPortal(entering){
  /* the choir swells and a single voice rises with you into the light */
  if (!audio.on) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  audio.choirGain.gain.cancelScheduledValues(t);
  audio.choirGain.gain.setTargetAtTime(entering ? 1.9 : 1.0, t, entering ? 3.2 : 1.2);
  if (entering){
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(semi(12), t);
    o.frequency.exponentialRampToValueAtTime(semi(24), t + 9);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(0.03, t + 5);
    og.gain.setTargetAtTime(0, t + 9.5, 0.8);
    o.connect(og).connect(audio.room);
    o.start(t); o.stop(t + 13);
    audio.portalV = o;
  } else if (audio.portalV){
    try { audio.portalV.stop(); } catch(e){}
    audio.portalV = null;
  }
}
function audioToggle(){
  if (!audio.on){ ensureAudio(); return; }
  audio.muted = !audio.muted;
  const t = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(t);
  audio.master.gain.setTargetAtTime(audio.muted ? 0 : 0.75, t, 0.25);
  showHint(audio.muted ? 'hushed — M to let the isles sing' : 'the isles are singing — M to hush them');
}
const _fallBase = new THREE.Vector3();
function audioFrame(dt){
  if (!audio.on || audio.muted) return;
  /* chord drift: every ~28-40s glide each singer to the next chord tone */
  audio.chordTimer -= dt;
  if (audio.chordTimer <= 0){
    audio.chordTimer = 28 + AR()*12;
    audio.chord = (audio.chord + 1) % CHORDS.length;
    const t = audio.ctx.currentTime;
    CHORDS[audio.chord].forEach((n, i) => {
      for (const o of audio.voices[i].oscs){
        o.frequency.cancelScheduledValues(t);
        o.frequency.setTargetAtTime(semi(n), t, 2.8);   // an eight-second lean, not a step
      }
    });
  }
  /* wind follows flight speed */
  const speed = fly.on ? (_mv.lengthSq() > 0 || pad.move.lengthSq() > 0 ? 1 : 0.3) : 0.15;
  audio.windSpeed += (speed - audio.windSpeed) * Math.min(1, dt*1.5);
  audio.windGain.gain.value = 0.028 + audio.windSpeed * 0.045;
  /* nearest waterfall base brightens the sparkle */
  let nearest = 1e9;
  for (const fi of fallInfos){
    _fallBase.set(fi.top.x, MIST_Y + 8, fi.top.z);
    nearest = Math.min(nearest, camera.position.distanceTo(_fallBase));
    nearest = Math.min(nearest, camera.position.distanceTo(fi.top));
  }
  audio.fallGain.gain.value = 0.08 * Math.exp(-nearest / 170);
}
document.addEventListener('visibilitychange', () => {
  if (!audio.on) return;
  if (document.hidden) audio.ctx.suspend();
  else audio.ctx.resume();
});

/* debug/screenshot hooks */
const qp = new URLSearchParams(location.search);
if (qp.has('t')){
  const v = parseFloat(qp.get('t'));
  tour.t = Number.isFinite(v) ? ((v % 1) + 1) % 1 : 0;   // out-of-range t would NaN the curves
}
window.__heaven = {
  ready: false,
  scene, gate, camera, renderer, audio,   // debug/QA hooks
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
                 geoms: renderer.info.memory.geometries, progs: renderer.info.programs.length }),
  setTour(tt){
    tt = ((tt % 1) + 1) % 1;
    tour.t = tt;
    const p = camCurve.getPointAt(tt);
    const l = lookCurve.getPoint((camCurve.getUtoTmapping(tt, 0) + 0.002) % 1);
    camSmooth.copy(p); lookSmooth.copy(l);
    camera.position.copy(p); camera.lookAt(l);
  },
};
if (qp.has('t')) window.__heaven.setTour(tour.t);

/* ============================================================
   13. Main loop
   ============================================================ */
const clock = new THREE.Clock();
let emaMs = 16;
let qTimer = 0;
let bestMs = 1000;     // decaying estimate of the display's refresh interval
let winMin = 1000;     // fastest raw frame in the current evaluation window
let calmWindows = 0;   // consecutive windows with clear headroom
const levelCooldown = new Array(QUALITY.length).fill(0);   // windows before a level that just failed may be retried
let shaderTime = 0;
document.addEventListener('visibilitychange', () => {
  /* wrap the shader clock while nobody is looking — float32 jitters at large
     values, but wrapping mid-view would visibly snap every shader animation */
  if (document.hidden && shaderTime > 600) shaderTime %= 600;
});

function setPixelLevel(lv){
  pixelLevel = lv;
  const q = QUALITY[lv];
  gradeUniforms.uTaps.value = [24, 24, 20, 12, 0][lv] || 0;   // crepuscular ray budget per rung
  if (composer.renderTarget1.samples !== q.msaa){
    /* sample-count changes need reallocation — dispose and the next frame
       rebuilds the targets with the new setting (works in both directions) */
    for (const rt of [composer.renderTarget1, composer.renderTarget2]){
      rt.samples = q.msaa;
      rt.dispose();
    }
  }
  onResize();
}
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  /* absolute scale, capped so a huge window cannot allocate absurd targets */
  const pr = Math.min(QUALITY[pixelLevel].px, 3840 / Math.max(innerWidth, innerHeight));
  renderer.setPixelRatio(pr);
  composer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gradeUniforms.uAspect.value = innerWidth/innerHeight;
  emberUniformsShared.uPx.value = (innerHeight * pr) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5)));
}
addEventListener('resize', onResize);
onResize();

let frames = 0;
function animate(){
  requestAnimationFrame(animate);
  const dtRaw = clock.getDelta();
  const dt = Math.min(0.05, dtRaw);   // clamped for simulation; metrics use the real value
  const t = clock.elapsedTime;
  /* continuous shader clock: accumulates while visible (float32-safe for
     hours) and wraps only while the tab is hidden — never a visible snap */
  shaderTime += dt;
  if (shaderTime > 14400) shaderTime %= 600;   // backstop after ~4h of truly continuous viewing
  uTime.value = shaderTime;

  /* islands bob and turn very slowly, resting on the light */
  for (const g of islandGroups){
    const u = g.userData;
    g.position.y = u.baseY + Math.sin(t*u.bobSpeed + u.bobPhase) * u.bobAmp;
    g.rotation.y = Math.sin(t*u.yawSpeed + u.yawPhase) * u.yawAmp;
  }
  gate.children[0].rotation.y = Math.sin(t*0.02)*0.01;

  updateBirds(t);
  feathers.update(t);
  petals.update(t);
  updateLeaves(t, dt);
  pollPad(dt);
  updateCamera(t, dt);
  camera.updateMatrixWorld();
  updateFlare(dt);
  audioFrame(dt);
  /* after the portal: the world eases back in from the white */
  if (!portalSeq.on && gradeUniforms.uFlash.value > 0){
    gradeUniforms.uFlash.value = Math.max(0, gradeUniforms.uFlash.value - dt*0.5);
  }

  /* hint fade */
  if (hintTimer > 0){ hintTimer -= dt; if (hintTimer <= 0) hintEl.classList.remove('show'); }

  composer.render();

  /* adaptive quality, two-way: measured from UNclamped frame times (the
     physics clamp used to hide how slow frames really were, so the ladder
     could never fire on the machines it was built for). Down when frames
     sag well past the display's refresh; up again after sustained headroom,
     with a cooldown so a level that just failed is not retried at once. */
  const ms = dtRaw*1000;
  if (frames > 30 && ms < 500){   // ignore tab-restore / debugger-pause spikes
    winMin = Math.min(winMin, Math.max(2, ms));
    emaMs = emaMs*0.96 + ms*0.04;
  }
  qTimer += dt;
  if (qTimer > 4 && frames > 30){
    qTimer = 0;
    /* slow upward decay: under sustained GPU-bound load winMin is merely the
       fastest SLOW frame, and a fast decay let bestMs re-baseline until ~30ms
       frames read as headroom and the ladder climbed while still slow */
    bestMs = Math.min(bestMs*1.06 + 0.2, winMin);
    winMin = 1000;
    for (let i = 0; i < levelCooldown.length; i++) if (levelCooldown[i] > 0) levelCooldown[i]--;
    if (emaMs > Math.max(21, bestMs*1.45) && pixelLevel < QUALITY.length - 1){
      setPixelLevel(pixelLevel + 1);
      levelCooldown[pixelLevel - 1] = 8;   // the level that just failed waits ~8 windows
      calmWindows = 0;
    } else if (emaMs < Math.max(17, bestMs*1.15) && emaMs < 18.5 && pixelLevel > 0 && levelCooldown[pixelLevel - 1] === 0){
      /* the absolute 18.5ms gate means sub-60Hz displays never probe upward —
         deliberate: on them the refresh estimate drifts under load, and a
         stable rung beats a 45s quality oscillation */
      if (++calmWindows >= 2){ calmWindows = 0; setPixelLevel(pixelLevel - 1); }
    } else {
      calmWindows = 0;
    }
  }

  frames++;
  if (frames === 2){
    window.__heaven.ready = true;
    clearTimeout(window.__loadWatchdog);
    document.getElementById('loader').classList.add('hide');
    document.getElementById('title').classList.add('show');
    setTimeout(() => document.getElementById('title').classList.remove('show'), 7000);
  }
}
animate();
</script>
